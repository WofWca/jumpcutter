<!DOCTYPE html>
<html>
<head>
    <title>Manual Test - Jump Cutter Per-Tab Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Jump Cutter Per-Tab Control - Manual Test</h1>
    
    <div class="test-section">
        <h2>Extension Status Check</h2>
        <button onclick="checkExtension()">Check Extension</button>
        <div id="extension-status"></div>
    </div>
    
    <div class="test-section">
        <h2>Overlay Button Check</h2>
        <button onclick="checkOverlay()">Check Overlay</button>
        <div id="overlay-status"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Video</h2>
        <video controls width="100%" id="test-video">
            <source src="https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4" type="video/mp4">
        </video>
    </div>
    
    <script>
        function checkExtension() {
            const statusDiv = document.getElementById('extension-status');
            
            // Check if extension injected its content
            const hasOverlayStyles = document.getElementById('jumpcutter-per-tab-styles');
            const hasOverlayControl = document.getElementById('jumpcutter-per-tab-control');
            const hasToggleButton = document.getElementById('jumpcutter-toggle-btn');
            
            let html = '';
            
            if (hasOverlayStyles) {
                html += '<div class="status success">✅ Overlay styles injected</div>';
            } else {
                html += '<div class="status error">❌ Overlay styles NOT found</div>';
            }
            
            if (hasOverlayControl) {
                html += '<div class="status success">✅ Overlay control container found</div>';
            } else {
                html += '<div class="status error">❌ Overlay control container NOT found</div>';
            }
            
            if (hasToggleButton) {
                html += '<div class="status success">✅ Toggle button found</div>';
                const buttonText = hasToggleButton.innerText;
                const buttonTitle = hasToggleButton.title;
                html += `<div class="status info">Button text: ${buttonText}</div>`;
                html += `<div class="status info">Button title: ${buttonTitle}</div>`;
            } else {
                html += '<div class="status error">❌ Toggle button NOT found</div>';
            }
            
            statusDiv.innerHTML = html;
        }
        
        function checkOverlay() {
            const statusDiv = document.getElementById('overlay-status');
            const button = document.getElementById('jumpcutter-toggle-btn');
            
            if (!button) {
                statusDiv.innerHTML = '<div class="status error">❌ No overlay button found!</div>';
                return;
            }
            
            const rect = button.getBoundingClientRect();
            let html = '<div class="status success">✅ Overlay button found</div>';
            html += `<div class="status info">Position: top=${rect.top}px, right=${window.innerWidth - rect.right}px</div>`;
            html += `<div class="status info">Size: ${rect.width}x${rect.height}px</div>`;
            html += `<div class="status info">Text: ${button.innerText}</div>`;
            html += `<div class="status info">Title: ${button.title}</div>`;
            
            // Test click
            html += '<div class="status info">Click the overlay button to test toggle functionality</div>';
            
            statusDiv.innerHTML = html;
        }
        
        // Auto-check after page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('Auto-checking extension status...');
                checkExtension();
            }, 1000);
        });
    </script>
</body>
</html>
